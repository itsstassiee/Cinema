<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Кінощоденник</title><style>
*{box-sizing:border-box}body{margin:0;background:#121218;color:#eee;font:16px system-ui}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:32px}button,input,select,textarea{font:inherit;color:inherit;background:#24242e;border:1px solid #41414e;border-radius:10px;padding:10px}button{cursor:pointer}button:hover{background:#41414e}.primary{background:#7855bd} .bar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.bar input{flex:1;min-width:160px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}.item{background:#202029;border-radius:14px;overflow:hidden}.poster{width:100%;aspect-ratio:2/3;object-fit:cover;background:#30303b;display:block}.info{padding:12px}.info button{margin-top:8px;width:100%}small{color:#b7b3c4}dialog{background:#202029;color:#eee;border:1px solid #555;border-radius:16px;width:min(540px,94vw);max-height:90vh;overflow:auto}dialog::backdrop{background:#000b}label{display:grid;gap:5px;margin:12px 0}textarea{min-height:80px;width:100%}h2{font-size:21px}#message{color:#c7b4ff} .danger{color:#ffaaaa}
</style><main><small>МОЯ ОСОБИСТА КОЛЕКЦІЯ</small><h1>Кінощоденник ✦</h1><div class="bar"><input id="q" placeholder="Назва фільму або серіалу"><button class="primary" id="search">Знайти</button><button id="manual">+ Вручну</button></div><p id="message" role="status"></p><section id="resultsSection" hidden><h2>Результати пошуку</h2><div id="results" class="grid"></div></section><h2>Моя колекція</h2><p id="stats"></p><div class="bar"><input id="filter" placeholder="Пошук у колекції"><select id="statusFilter"><option value="">Усі статуси</option><option>Переглянуто</option><option>Дивлюся</option><option>Хочу подивитися</option><option>Закинула</option></select><select id="typeFilter"><option value="">Усі типи</option><option>Фільм</option><option>Серіал</option></select><select id="sort"><option value="new">Нещодавно додані</option><option value="rating">За оцінкою</option><option value="title">За назвою</option></select></div><div id="collection" class="grid"></div><h2>Резервна копія</h2><div class="bar"><button id="export">↓ Експорт JSON</button><button id="csv">↓ Експорт CSV</button><button id="import">↑ Імпорт JSON</button><input type="file" id="file" accept=".json" hidden></div><small>Дані зберігаються у цьому браузері. Регулярно експортуй резервну копію. Джерела пошуку: TVmaze та Apple iTunes Search.</small></main>
<dialog id="editor"><form id="editForm"><h2>Картка перегляду</h2><label>Назва<input name="title" required></label><label>Тип<select name="type"><option>Серіал</option><option>Фільм</option></select></label><label>Рік<input name="year"></label><label>Посилання на постер<input name="poster"></label><label>Опис<textarea name="description"></textarea></label><label>Жанри / категорії<input name="genres"></label><label>Статус<select name="status"><option>Хочу подивитися</option><option>Дивлюся</option><option>Переглянуто</option><option>Закинула</option></select></label><label>Оцінка (0 — не оцінено)<input name="rating" type="number" min="0" max="10" step="0.5"></label><label>Романтика (0–10)<input name="romance" type="number" min="0" max="10" step="0.5"></label><label>Кінцівка<select name="ending"><option>Не вказано</option><option>Щаслива</option><option>Трагічна</option><option>Відкрита</option><option>Гірко-солодка</option></select></label><label>Сезон / серія<input name="progress" placeholder="2 сезон, 5 серія"></label><label>Дата перегляду<input name="date" type="date"></label><label>Мої нотатки<textarea name="notes"></textarea></label><div class="bar"><button class="primary" type="submit">Зберегти</button><button type="button" id="cancel">Скасувати</button><button type="button" id="remove" class="danger">Видалити</button></div></form></dialog>
<script>
const $=id=>document.getElementById(id), key='cinema-diary-v1';let data=[],active=null,found=[];
try{data=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){$('message').textContent='Не вдалося прочитати локальні дані.'}
function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch(e){alert('Не вдалося зберегти. Експортуй резервну копію.')}render()}
function el(tag,txt){let e=document.createElement(tag);if(txt!==undefined)e.textContent=txt;return e}
function card(x,search){let c=el('article');c.className='item';let im=el('img');im.className='poster';im.alt=x.title;im.loading='lazy';if(/^https:\/\//i.test(x.poster||''))im.src=x.poster;c.append(im);let b=el('div');b.className='info';b.append(el('strong',x.title),el('p', [x.year,x.type].filter(Boolean).join(' · ')));if(!search)b.append(el('small',x.status+' · '+(x.rating? '★ '+x.rating+'/10':'Без оцінки')));else if(x.description)b.append(el('small',x.description.slice(0,130)+'…'));let btn=el('button',search?'Додати':'Редагувати');btn.onclick=()=>openEdit(x);b.append(btn);c.append(b);return c}
function render(){let a=data.filter(x=>(x.title+' '+x.genres).toLowerCase().includes($('filter').value.toLowerCase())&&(!$('statusFilter').value||x.status===$('statusFilter').value)&&(!$('typeFilter').value||x.type===$('typeFilter').value));if($('sort').value==='rating')a.sort((a,b)=>b.rating-a.rating);else if($('sort').value==='title')a.sort((a,b)=>a.title.localeCompare(b.title));else a.sort((a,b)=>(b.added||0)-(a.added||0));$('collection').replaceChildren(...a.map(x=>card(x,false)));$('stats').textContent=`${data.length} у колекції · ${data.filter(x=>x.status==='Переглянуто').length} переглянуто · ${data.filter(x=>x.status==='Хочу подивитися').length} у планах`;if(!a.length)$('collection').append(el('p','Тут поки порожньо.'))}
function openEdit(x={}){active=data.find(y=>y.id===x.id)||null;let f=$('editForm');f.reset();for(let n of ['title','type','year','poster','description','genres','status','rating','romance','ending','progress','date','notes'])if(x[n]!=null)f.elements[n].value=x[n];$('remove').hidden=!active;f.dataset.id=x.id||'';$('editor').showModal()}
$('editForm').onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target));x.id=active?.id||e.target.dataset.id||('manual-'+Date.now());x.added=active?.added||Date.now();x.rating=Number(x.rating);x.romance=Number(x.romance);data=data.filter(y=>y.id!==x.id);data.push(x);save();$('editor').close()};$('cancel').onclick=()=>$('editor').close();$('remove').onclick=()=>{if(active&&confirm('Видалити картку?')){data=data.filter(x=>x.id!==active.id);save();$('editor').close()}};$('manual').onclick=()=>openEdit();
function plain(s){return new DOMParser().parseFromString(s||'','text/html').body.textContent||''}
async function tv(q){let r=await fetch('https://api.tvmaze.com/search/shows?q='+encodeURIComponent(q));if(!r.ok)throw Error();return (await r.json()).map(({show:s})=>({id:'tv-'+s.id,title:s.name,type:'Серіал',year:(s.premiered||'').slice(0,4),poster:s.image?.original||'',description:plain(s.summary),genres:s.genres.join(', ')}))}
function apple(q){return new Promise((resolve,reject)=>{let cb='apple_'+Date.now(),s=el('script');let t=setTimeout(()=>{cleanup();reject(Error())},12000);function cleanup(){clearTimeout(t);s.remove();delete window[cb]}window[cb]=r=>{cleanup();resolve((r.results||[]).map(x=>({id:'film-'+x.trackId,title:x.trackName,type:'Фільм',year:(x.releaseDate||'').slice(0,4),poster:(x.artworkUrl100||'').replace('100x100','600x600'),description:x.longDescription||x.shortDescription||'',genres:x.primaryGenreName||''})).filter(x=>x.title))};s.onerror=()=>{cleanup();reject(Error())};s.src='https://itunes.apple.com/search?media=movie&entity=movie&country=us&limit=20&term='+encodeURIComponent(q)+'&callback='+cb;document.head.append(s)})}
$('search').onclick=async()=>{let q=$('q').value.trim();if(!q)return;$('search').disabled=true;$('message').textContent='Шукаю…';let r=await Promise.allSettled([tv(q),apple(q)]);found=r.flatMap(x=>x.status==='fulfilled'?x.value:[]);$('results').replaceChildren(...found.map(x=>card(x,true)));$('resultsSection').hidden=false;$('message').textContent=found.length?'Знайдено: '+found.length+(r.some(x=>x.status==='rejected')?' (одне джерело недоступне)':''):'Нічого не знайдено або джерела недоступні. Спробуй оригінальну назву чи додай вручну.';$('search').disabled=false};$('q').onkeydown=e=>{if(e.key==='Enter')$('search').click()};
function download(content,name,type){let u=URL.createObjectURL(new Blob([content],{type})),a=el('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}
$('export').onclick=()=>download(JSON.stringify({version:1,items:data},null,2),'cinema-diary.json','application/json');$('csv').onclick=()=>{let fields=['title','type','year','status','rating','romance','ending','genres','progress','date','notes','description','poster'];let quote=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"';download('\ufeff'+[fields.join(','),...data.map(x=>fields.map(k=>quote(x[k])).join(','))].join('\r\n'),'cinema-diary.csv','text/csv;charset=utf-8')};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{let obj=JSON.parse(await e.target.files[0].text()),a=Array.isArray(obj)?obj:obj.items;if(!Array.isArray(a)||!a.every(x=>x&&typeof x.title==='string'&&typeof x.id==='string'))throw Error();let ids=new Set(data.map(x=>x.id));let count=0;for(let x of a)if(!ids.has(x.id)){data.push(x);ids.add(x.id);count++}save();alert('Додано: '+count)}catch(err){alert('Не вдалося імпортувати файл.')}e.target.value=''};for(let id of ['filter','statusFilter','typeFilter','sort'])$(id).oninput=render;render();
</script></html>
